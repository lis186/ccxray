<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccxray — 高橋流簡報(10 分鐘)</title>
<style>
  /* 高橋流:一頁一句、字要夠大、節奏要快。
     視覺層:九步真實介面截圖(ccxray v2.3.0 實拍),逐步揭開完整 dashboard;
     僅 STEP 1 為架構示意線框。深色定調(X-ray 影像的世界觀),不隨系統主題切換。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #05080c;
    color: #e6edf3;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: pointer;
  }
  #stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5vmin 6vmin 9vmin;
  }
  .slide {
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: .02em;
    font-size: clamp(2.6rem, 13vw, 12rem);
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .slide.long  { font-size: clamp(2rem, 7.5vw, 7rem); }
  .slide.small { font-size: clamp(1.4rem, 4.5vw, 3.6rem); font-weight: 700; color: #9fb0c0; }
  .slide.code {
    font-family: "SF Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: clamp(1.6rem, 5.5vw, 5rem);
    font-weight: 600;
    color: #7ee787;
    background: #0b1420;
    border: 1px solid #1d2d40;
    border-radius: .18em;
    padding: .5em .7em;
  }
  .slide.code { position: relative; user-select: text; cursor: text; }
  .slide.code.longcode { font-size: clamp(0.95rem, 3.1vw, 2.7rem); }
  .copybtn {
    position: absolute; top: .28em; right: .32em;
    font-size: .32em; line-height: 1;
    background: #0d1a29; color: #8b98a5;
    border: 1px solid #1d2d40; border-radius: .3em;
    padding: .35em .55em; cursor: pointer;
    font-family: inherit; user-select: none;
    transition: color .15s, border-color .15s;
  }
  .copybtn:hover { color: #22d3ee; border-color: #22d3ee; }
  .copybtn.ok { color: #7ee787; border-color: #1d4428; }
  .slide .sub {
    display: block;
    margin-top: .6em;
    font-size: .32em;
    font-weight: 600;
    color: #8b98a5;
    letter-spacing: .06em;
  }
  .accent { color: #22d3ee; }
  .hot    { color: #ff7b72; }
  .good   { color: #7ee787; }
  .dim    { color: #55606b; }
  .warn   { color: #e3b341; }

  /* 第二層敘事:英雄旅程幕別,常駐右上角 */
  #act {
    position: fixed; top: 2.4vmin; right: 3vmin;
    font-size: clamp(.7rem, 1.6vmin, 1rem);
    font-weight: 700; letter-spacing: .18em;
    color: #22d3ee; opacity: .85;
    border: 1px solid #164e5f; border-radius: 99px;
    padding: .45em 1.1em;
    transition: opacity .3s;
    z-index: 5;
  }
  #counter {
    position: fixed; bottom: 2.2vmin; right: 3vmin;
    font-size: clamp(.65rem, 1.5vmin, .9rem);
    color: #55606b; font-variant-numeric: tabular-nums;
  }
  #hint {
    position: fixed; bottom: 2.2vmin; left: 3vmin;
    font-size: clamp(.65rem, 1.5vmin, .9rem);
    color: #55606b;
  }
  #bar {
    position: fixed; left: 0; bottom: 0; height: 4px; width: 0;
    background: linear-gradient(90deg, #22d3ee, #7ee787);
    transition: width .15s ease-out;
  }

  /* ────────────────────────────────────────────────
     視覺層:真實截圖,逐步揭開
     ──────────────────────────────────────────────── */
  .vizslide {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3vh;
    animation: pop .22s ease-out;
  }
  .vcap {
    font-size: clamp(1.1rem, 3vw, 2rem);
    font-weight: 900; letter-spacing: .03em;
  }
  .vcap .step {
    display: inline-block; margin-right: .8em;
    font-size: .55em; font-weight: 700; letter-spacing: .2em;
    color: #22d3ee; border: 1px solid #164e5f; border-radius: 99px;
    padding: .3em .9em; vertical-align: .18em;
    font-variant-numeric: tabular-nums;
  }
  .vnote {
    font-size: clamp(.65rem, 1.5vmin, .85rem);
    color: #55606b; letter-spacing: .1em; margin-top: -1.6vh;
  }
  .shots { display: flex; gap: 2vw; align-items: flex-start; justify-content: center; max-width: 94vw; }
  .shot {
    border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
    background: #0d1117; box-shadow: 0 12px 40px #00000088;
    flex: 0 1 auto; min-width: 0;
  }
  .shot img { display: block; width: 100%; height: auto; }
  .shot.hero { box-shadow: 0 0 0 1px #22d3ee55, 0 0 44px #22d3ee2e, 0 12px 40px #00000088; }
  /* 高度上限:過高的截圖從底部裁掉(DAILY 長列表、diff 頁下方留白) */
  .shot.crop   { max-height: 56vh; }
  .shot.croptall { max-height: 62vh; }

  /* STEP 1:架構分鏡(唯一的非截圖視覺)。
     連續五頁共用同一個 #pxroot——翻頁只換 scene-N class,元素靠 CSS
     transition 平移/縮放延伸,不重建 DOM,節奏不中斷。 */
  .pxwrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3vh;
    animation: pop .22s ease-out;
  }
  .pxscene { position: relative; width: 86vw; height: 46vh; font-size: clamp(11px, 1.9vh, 16px); }
  .pxworld { position: absolute; inset: 0; transform-origin: 50% 42%; transition: transform .7s cubic-bezier(.33,0,.15,1); }
  .pxnode {
    position: absolute; top: 42%; transform: translateY(-50%);
    border: 1px solid #1d2d40; background: #0b1420; border-radius: 8px;
    padding: .85em 1.3em; font-weight: 700; color: #c9d5e0;
    white-space: nowrap; font-size: 1.25em; z-index: 1;
    transition: left .7s cubic-bezier(.33,0,.15,1), transform .7s cubic-bezier(.33,0,.15,1), opacity .5s ease, box-shadow .6s ease;
  }
  #px-cc { left: 5%; }
  #px-api { left: auto; right: 5%; }
  #px-x { left: 50%; transform: translate(-50%, -50%) scale(0); border-color: #22d3ee; color: #22d3ee; z-index: 2; }
  .pxpipe { position: absolute; top: 42%; height: 2px; margin-top: -1px; background: #1d2d40; z-index: 0; transition: opacity .5s ease; }
  .pxpipe.pl { left: 13%; width: 37%; }
  .pxpipe.pr { left: 50%; width: 37%; }
  .pxpipe .dot { position: absolute; top: -2.5px; width: 7px; height: 7px; border-radius: 50%; }
  .pxpipe .dot.req { background: #22d3ee; animation: flowR 2.2s linear infinite; }
  .pxpipe .dot.res { background: #7ee787; animation: flowL 2.2s linear infinite; animation-delay: 1.1s; }
  @keyframes flowR { from { left: -3px; } to { left: calc(100% - 4px); } }
  @keyframes flowL { from { left: calc(100% - 4px); } to { left: -3px; } }
  #px-gap {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    width: 9em; height: 9em; border: 1px dashed #22d3ee66; border-radius: 50%;
    opacity: 0; transition: opacity .5s ease;
  }
  .pxlogs {
    position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: .45em;
    opacity: 0; transition: opacity .4s ease; z-index: 2;
  }
  .pxlog {
    display: flex; gap: 1.1em; align-items: baseline;
    border: 1px solid #1d2d40; background: #0b1420; border-radius: 5px;
    padding: .45em .8em; font-family: ui-monospace, monospace;
    font-size: .95em; color: #c9d5e0; white-space: nowrap;
    opacity: 0; animation: rowin .4s ease-out forwards;
  }
  .pxlog .t { color: #55606b; }
  .pxlog .ok { color: #7ee787; }
  @keyframes rowin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* 分鏡狀態:每頁 = 前頁的延伸 */
  .scene-1 #px-cc { left: 50%; transform: translate(-50%, -50%) scale(1.3); }
  .scene-1 #px-api, .scene-1 .pxpipe { opacity: 0; }
  .scene-3 .pxworld { transform: scale(1.7); }
  .scene-3 #px-cc, .scene-3 #px-api { opacity: .4; }
  .scene-3 #px-gap { opacity: 1; }
  .scene-4 .pxworld { transform: scale(1.45); }
  .scene-4 #px-cc, .scene-4 #px-api { opacity: .75; }
  .scene-4 #px-x, .scene-5 #px-x { transform: translate(-50%, -50%) scale(1); }
  .scene-4 #px-x { box-shadow: 0 0 18px #22d3ee33; }
  .scene-5 #px-x { box-shadow: 0 0 26px #22d3ee55; }
  .scene-5 .pxlogs { opacity: 1; }

  /* STEP 9:auto-compact 逐格重播。26 幀真實泳道 render(log 前綴逐格),
     一個 #acroot 跨六頁存活,每頁自動播放自己的段落後定格;
     倒退重播該段。prefers-reduced-motion 直接跳到段尾。 */
  .acscene { display: flex; justify-content: center; width: 100%; }
  .acframe { width: 90vw; }

  /* STEP 10:模型選擇對照分鏡。#mcroot 跨三頁存活:good 獨秀 →
     bad 滑入並排 → 真實統計浮現。 */
  .mcscene { display: flex; flex-direction: column; gap: 2vh; width: 92vw; }
  .mcrow { display: flex; gap: 2vw; justify-content: center; }
  .mccol { flex: 1 1 0; min-width: 0; transition: opacity .6s ease, transform .6s ease; }
  .mccol .shot { display: inline-block; }
  .mccol .shot img { max-height: 46vh; width: auto; max-width: 100%; }
  .mccol { text-align: center; }
  .mccol .mclabel { font-weight: 900; font-size: clamp(.9rem, 2vw, 1.3rem); margin-bottom: .8vh; text-align: center; }
  .mccol .mcstats { display: flex; gap: 1.2em; justify-content: center; margin-top: 1vh;
    font-family: ui-monospace, monospace; font-size: clamp(.75rem, 1.8vmin, 1.05rem);
    opacity: 0; transition: opacity .6s ease; }
  .mccol .mcstats b { font-weight: 700; }
  .mccol.bad { opacity: 0; transform: translateX(4vw); }
  .mc-2 .mccol.bad, .mc-3 .mccol.bad { opacity: 1; transform: none; }
  .mc-3 .mcstats { opacity: 1; }
  /* 縮時攝影:x 軸=時間,左→右擦除 = 時間游標;跨線的長 bar 會逐漸變長 */
  .mccol img.wipe { clip-path: inset(0 100% 0 0); }
  .mccol img.wipe.play { animation: tlwipe linear forwards; }
  .mccol img.wipe.done { clip-path: none; animation: none; }
  @keyframes tlwipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }
  @media (prefers-reduced-motion: reduce) { .mccol img.wipe { clip-path: none !important; } }

  /* STEP 6:cache 過期分鏡。同一張真實 session 卡跨頁存活(#cxroot),
     翻頁只換 cx-N class:四個狀態圖層原地交叉淡變,紅色態疊上第二畫格
     以原生 cachePulse 節奏閃爍;鏡頭在警告時推近、過期時拉回。 */
  @keyframes cacheBlink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  .cxscene { display: flex; align-items: center; justify-content: center; height: 46vh; }
  .cxzoom { transition: transform .7s cubic-bezier(.33,0,.15,1); transform-origin: 72% 86%; }
  .cxcard { position: relative; width: min(34vw, 440px); min-width: 260px; }
  .cxcard img { display: block; width: 100%; height: auto; }
  .cxcard img.ov { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .cx-2 .cxzoom { transform: scale(1.07); }
  .cx-3 .cxzoom { transform: scale(1.24); }
  .cx-2 img.ov.near { opacity: 1; }
  .cx-3 img.ov.closea { opacity: 1; }
  .cx-3 img.ov.closeb { animation: cacheBlink 1s ease-in-out infinite; }
  .cx-4 img.ov.expired { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="act"></div>
<div id="stage"><div class="slide" id="slide"></div></div>
<div id="bar"></div>
<div id="counter"></div>
<div id="hint">← → / 空白鍵 / 點擊翻頁 · A 自動播放</div>
<script>
// 英雄旅程八幕(第二敘事層)。每張投影片標記所屬幕別。
const ACTS = [
  '序幕 · 大爆發',
  '第一幕 · 上限之謎',
  '第二幕 · 打造 X 光機',
  '第三幕 · 第一張 X 光片',
  '第四幕 · 試煉之路',
  '第五幕 · 深淵',
  '第六幕 · 歸返',
  '終幕 · 處方箋',
];

// 內嵌的真實截圖(ccxray v2.3.0,合成示範資料實拍;build-deck.mjs 產生)
const IMG = {
  topbar: '{{IMG:crop-topbar}}',
  projects: '{{IMG:crop-projects}}',
  sessions: '{{IMG:crop-sessions}}',
  steps: '{{IMG:crop-steps}}',
  agentcard: '{{IMG:crop-agentcard}}',
  usagemo: '{{IMG:crop-usage-monthly}}',
  usageday: '{{IMG:crop-usage-daily}}',
  usageacct: '{{IMG:crop-usage-accounts}}',
  cachefar: '{{IMG:cache-far}}',
  cachenear: '{{IMG:cache-near}}',
  cacheclosea: '{{IMG:cache-close-a}}',
  cachecloseb: '{{IMG:cache-close-b}}',
  cacheexpired: '{{IMG:cache-expired}}',
  swimlane: '{{IMG:crop-swimlane}}',
  tax: '{{IMG:turn1-tax}}',
  fanoutgood: '{{IMG:fanout-good}}',
  fanoutbad: '{{IMG:fanout-bad}}',
  full: '{{IMG:full-session}}',
};

const ACF = [
  '{{IMG:spiral-01}}',
  '{{IMG:spiral-02}}',
  '{{IMG:spiral-03}}',
  '{{IMG:spiral-04}}',
  '{{IMG:spiral-05}}',
  '{{IMG:spiral-06}}',
  '{{IMG:spiral-07}}',
  '{{IMG:spiral-08}}',
  '{{IMG:spiral-09}}',
  '{{IMG:spiral-10}}',
  '{{IMG:spiral-11}}',
  '{{IMG:spiral-12}}',
  '{{IMG:spiral-13}}',
  '{{IMG:spiral-14}}',
  '{{IMG:spiral-15}}',
  '{{IMG:spiral-16}}',
  '{{IMG:spiral-17}}',
  '{{IMG:spiral-18}}',
  '{{IMG:spiral-19}}',
  '{{IMG:spiral-20}}',
  '{{IMG:spiral-21}}',
  '{{IMG:spiral-22}}',
  '{{IMG:spiral-23}}',
  '{{IMG:spiral-24}}',
  '{{IMG:spiral-25}}',
  '{{IMG:spiral-26}}',
];

const VIZ_STEPS = 11;
const NOTE = 'ccxray v2.3 實際畫面（示範資料）';

// STEP 1 是分鏡(pxSceneHTML);2..10 = 真實截圖
// ── STEP 1 架構分鏡:同一個 #pxroot 跨頁存活,翻頁只換 scene class ──
const PX_SCENES = 5;
function pxLogsHTML() {
  const rows = [
    ['12:04:11', 'POST /v1/messages', '3.2s'],
    ['12:04:19', 'POST /v1/messages', '8.7s'],
    ['12:04:31', 'POST /v1/messages · subagent', '2.1s'],
  ];
  return rows.map((r, k) =>
    '<div class="pxlog" style="animation-delay:' + (0.15 + k * 0.3) + 's">' +
    '<span class="t">' + r[0] + '</span>' + r[1] +
    '<span class="ok">200</span><span class="t">' + r[2] + '</span></div>').join('');
}
function pxSceneHTML(k) {
  return '<div id="pxroot" class="pxscene scene-' + k + '">' +
    '<div class="pxworld">' +
      '<div class="pxpipe pl"><span class="dot req"></span><span class="dot res"></span></div>' +
      '<div class="pxpipe pr"><span class="dot req"></span><span class="dot res"></span></div>' +
      '<div class="pxnode" id="px-cc">Claude Code</div>' +
      '<div class="pxnode" id="px-api">Anthropic API</div>' +
      '<div class="pxnode" id="px-x">ccxray</div>' +
      '<div id="px-gap"></div>' +
      '<div class="pxlogs" id="px-logs">' + (k >= 5 ? pxLogsHTML() : '') + '</div>' +
    '</div></div>';
}
function pxApply(k) {
  const root = stageEl.querySelector('#pxroot');
  root.className = 'pxscene scene-' + k;
  // 進入分鏡 5 時重灌 log,讓逐列進場動畫重跑
  const logs = root.querySelector('#px-logs');
  logs.innerHTML = k >= 5 ? pxLogsHTML() : '';
}

// ── STEP 10 模型選擇對照分鏡 ──
function mcSceneHTML(k) {
  return '<div id="mcroot" class="mcscene mc-' + k + '"><div class="mcrow">' +
    '<div class="mccol good"><div class="mclabel"><span class="good">選對模型</span> · window 充足</div>' +
      '<div class="shot hero"><img class="wipe" src="' + IMG.fanoutgood + '" alt=""></div>' +
      '<div class="mcstats"><span class="good">一片綠</span><span>快進快出</span><span>零失敗</span></div></div>' +
    '<div class="mccol bad"><div class="mclabel"><span class="hot">模型太小</span> · window 不足</div>' +
      '<div class="shot"><img class="wipe" src="' + IMG.fanoutbad + '" alt=""></div>' +
      '<div class="mcstats"><span class="hot">失敗率飆高</span><span class="hot">長紅 bar</span><span class="hot">更久、更貴</span></div></div>' +
  '</div></div>';
}
// 縮時倍率一致:同一時間比例尺,GOOD 34m→7s、BAD 52m→10.7s
function mcApply(k) {
  const root = stageEl.querySelector('#mcroot');
  root.className = 'mcscene mc-' + k;
  const g = root.querySelector('.mccol.good img.wipe');
  const b = root.querySelector('.mccol.bad img.wipe');
  const play = (el, sec) => { el.classList.remove('play', 'done'); void el.offsetWidth; el.style.animationDuration = sec + 's'; el.classList.add('play'); };
  if (k === 1) { play(g, 7); b.classList.remove('play', 'done'); }
  else if (k === 2) { g.classList.remove('play'); g.classList.add('done'); play(b, 10); }
  else { g.classList.remove('play'); b.classList.remove('play'); g.classList.add('done'); b.classList.add('done'); }
}

// ── STEP 9 auto-compact 逐格重播 ──
let acTimer = null;
function acStop() { if (acTimer) { clearInterval(acTimer); acTimer = null; } }
function acSceneHTML(from) {
  return '<div id="acroot" class="acscene"><div class="shot hero acframe"><img id="acframe" src="' + ACF[from - 1] + '" alt=""></div></div>';
}
function acPlay(from, to) {
  acStop();
  const img = stageEl.querySelector('#acframe');
  let idx = from;
  img.src = ACF[idx - 1];
  if (to <= from || matchMedia('(prefers-reduced-motion: reduce)').matches) { img.src = ACF[to - 1]; return; }
  acTimer = setInterval(() => {
    idx++;
    img.src = ACF[idx - 1];
    if (idx >= to) acStop();
  }, 420);
}

// ── STEP 6 cache 過期分鏡:同一張真實卡片跨頁存活,狀態圖層交叉淡變 ──
function cxSceneHTML(k) {
  return '<div id="cxroot" class="cxscene cx-' + k + '">' +
    '<div class="cxzoom"><div class="shot hero cxcard">' +
      '<img class="base" src="' + IMG.cachefar + '" alt="">' +
      '<img class="ov near" src="' + IMG.cachenear + '" alt="">' +
      '<img class="ov closea" src="' + IMG.cacheclosea + '" alt="">' +
      '<img class="ov closeb" src="' + IMG.cachecloseb + '" alt="">' +
      '<img class="ov expired" src="' + IMG.cacheexpired + '" alt="">' +
    '</div></div></div>';
}
function cxApply(k) {
  stageEl.querySelector('#cxroot').className = 'cxscene cx-' + k;
}

function renderViz(s) {
  const img = (k, cls, style) => '<div class="shot ' + (cls || '') + '"' + (style ? ' style="' + style + '"' : '') + '><img src="' + IMG[k] + '" alt=""></div>';
  switch (s) {
    case 2: return '<div class="shots">' + img('topbar', 'hero', 'width:88vw') + '</div>';
    case 3: return '<div class="shots">' + img('projects', '', 'width:24vw;min-width:230px') + img('sessions', 'hero', 'width:26vw;min-width:250px') + '</div>';
    case 4: return '<div class="shots">' + img('steps', 'hero croptall', 'width:44vw;min-width:340px') + '</div>';
    case 5: return '<div class="shots">' + img('tax', 'hero', 'width:88vw;max-height:64vh') + '</div>';
    case 6: return '<div class="shots">' + img('agentcard', '', 'width:22vw;min-width:220px;max-height:60vh') +
      '<div style="display:flex;flex-direction:column;gap:2vh;width:30vw;min-width:280px">' +
      img('usagemo', 'hero') + img('usageday', 'hero') + '</div>' +

let i = 0, timer = null;
const stageEl = document.getElementById('stage');
const actEl = document.getElementById('act');
const barEl = document.getElementById('bar');
const counterEl = document.getElementById('counter');

function show(n) {
  i = Math.max(0, Math.min(S.length - 1, n));
  const s = S[i];
  if (s.mc) {
    const capHtml = '<div class="vcap"><span class="step">STEP 10/' + VIZ_STEPS + '</span>' + s.t + '</div>';
    const root = stageEl.querySelector('#mcroot');
    if (root) {
      mcApply(s.mc);
      const capEl = stageEl.querySelector('.vcap');
      const tmp = document.createElement('template');
      tmp.innerHTML = capHtml;
      capEl.replaceWith(tmp.content.firstChild);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'pxwrap';
      wrap.innerHTML = mcSceneHTML(s.mc) + capHtml + '<div class="vnote">真實 session birds-eye overview · 縮時重播</div>';
      stageEl.replaceChildren(wrap);
    }
    mcApply(s.mc);
    actEl.textContent = ACTS[s.a];
    barEl.style.width = ((i + 1) / S.length * 100) + '%';
    counterEl.textContent = (i + 1) + ' / ' + S.length;
    try { location.hash = i ? '#' + (i + 1) : ''; } catch (_) {}
    return;
  }
  if (s.ac) {
    const capHtml = '<div class="vcap"><span class="step">STEP 9/' + VIZ_STEPS + '</span>' + s.t + '</div>';
    const root = stageEl.querySelector('#acroot');
    if (root) {
      const capEl = stageEl.querySelector('.vcap');
      const tmp = document.createElement('template');
      tmp.innerHTML = capHtml;
      capEl.replaceWith(tmp.content.firstChild);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'pxwrap';
      wrap.innerHTML = acSceneHTML(s.ac[0]) + capHtml + '<div class="vnote">實際 render 逐格重播（示範資料）</div>';
      stageEl.replaceChildren(wrap);
    }
    acPlay(s.ac[0], s.ac[1]);
    actEl.textContent = ACTS[s.a];
    barEl.style.width = ((i + 1) / S.length * 100) + '%';
    counterEl.textContent = (i + 1) + ' / ' + S.length;
    try { location.hash = i ? '#' + (i + 1) : ''; } catch (_) {}
    return;
  }
  acStop();
  if (s.cx) {
    const capHtml = '<div class="vcap"><span class="step">STEP 7/' + VIZ_STEPS + '</span>' + s.t + '</div>';
    const root = stageEl.querySelector('#cxroot');
    if (root) {
      cxApply(s.cx);
      const capEl = stageEl.querySelector('.vcap');
      const tmp = document.createElement('template');
      tmp.innerHTML = capHtml;
      capEl.replaceWith(tmp.content.firstChild);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'pxwrap';
      wrap.innerHTML = cxSceneHTML(s.cx) + capHtml + '<div class="vnote">' + NOTE + '</div>';
      stageEl.replaceChildren(wrap);
    }
    actEl.textContent = ACTS[s.a];
    barEl.style.width = ((i + 1) / S.length * 100) + '%';
    counterEl.textContent = (i + 1) + ' / ' + S.length;
    try { location.hash = i ? '#' + (i + 1) : ''; } catch (_) {}
    return;
  }
  if (s.sc) {
    const capHtml = '<div class="vcap"><span class="step">STEP 1/' + VIZ_STEPS + '</span>' + s.t + '</div>';
    const root = stageEl.querySelector('#pxroot');
    if (root) {
      // 前一頁也是分鏡:不重建,元素以 transition 延伸到新狀態
      pxApply(s.sc);
      const capEl = stageEl.querySelector('.vcap');
      const tmp = document.createElement('template');
      tmp.innerHTML = capHtml;
      capEl.replaceWith(tmp.content.firstChild);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'pxwrap';
      wrap.innerHTML = pxSceneHTML(s.sc) + capHtml + '<div class="vnote">架構示意</div>';
      stageEl.replaceChildren(wrap);
    }
    actEl.textContent = ACTS[s.a];
    barEl.style.width = ((i + 1) / S.length * 100) + '%';
    counterEl.textContent = (i + 1) + ' / ' + S.length;
    try { location.hash = i ? '#' + (i + 1) : ''; } catch (_) {}
    return;
  }
  const el = document.createElement('div');
  if (s.v) {
    el.className = 'vizslide';
    el.innerHTML = renderViz(s.v) +
      '<div class="vcap"><span class="step">STEP ' + s.v + '/' + VIZ_STEPS + '</span>' + s.t + '</div>' +
      (s.v > 1 ? '<div class="vnote">' + NOTE + '</div>' : '');
  } else {
    el.className = 'slide' + (s.c ? ' ' + s.c : '');
    el.innerHTML = s.t;
    if (s.copy) {
      const btn = document.createElement('button');
      btn.className = 'copybtn';
      btn.textContent = '⧉';
      btn.title = '複製指令';
      btn.onclick = ev => { ev.stopPropagation(); copyText(s.copy, btn); };
      el.appendChild(btn);
    }
  }
  stageEl.replaceChildren(el);
  actEl.textContent = ACTS[s.a];
  barEl.style.width = ((i + 1) / S.length * 100) + '%';
  counterEl.textContent = (i + 1) + ' / ' + S.length;
  try { location.hash = i ? '#' + (i + 1) : ''; } catch (_) {}
}
function next() { show(i + 1); }
function prev() { show(i - 1); }
// code 頁複製按鈕:講者現場示範、聽眾開同一份簡報照做,零打字零打錯
function copyText(text, btn) {
  const done = ok => {
    btn.textContent = ok ? '✓' : '✗';
    btn.classList.toggle('ok', ok);
    setTimeout(() => { btn.textContent = '⧉'; btn.classList.remove('ok'); }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true), fallback);
  } else fallback();
}

function toggleAuto() {
  if (timer) { clearInterval(timer); timer = null; }
  else { timer = setInterval(() => { if (i >= S.length - 1) toggleAuto(); else next(); }, 6000); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(S.length - 1);
  else if (e.key === 'a' || e.key === 'A') toggleAuto();
  else if (e.key === 'd' || e.key === 'D') window.open('http://localhost:5577', '_blank');
});
document.addEventListener('click', e => {
  if (e.target.closest('.slide.code')) return;   // code 頁開放選字/複製,不觸發翻頁
  (e.clientX < window.innerWidth * 0.25) ? prev() : next();
});
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -30) next(); else if (dx > 30) prev();
  touchX = null;
}, { passive: true });

let start = 0;
try { start = (parseInt(location.hash.slice(1), 10) - 1) || 0; } catch (_) {}
show(start);
</script>
