name: Create release tag

on:
  push:
    branches: [claude/release-tag-forgot-4f0aje]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v2.3.1';
            const sha = '611927506871290def1a000d36561e077d2bf288';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
              core.info(`Created ${tag} at ${sha}`);
            } catch (e) {
              if (e.status === 422) { core.info(`${tag} already exists, nothing to do`); }
              else { throw e; }
            }
