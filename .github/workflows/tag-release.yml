name: Create release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v2.3.1)'
        required: true
      sha:
        description: 'Full commit SHA to tag'
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { tag, sha } = context.payload.inputs;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha,
            });
